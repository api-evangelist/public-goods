name: Public Goods
description: Public Goods is a direct-to-consumer e-commerce retailer selling household essentials, personal
  care, and home products under its own private label, with an emphasis on natural formulations, simplified
  ingredient lists, minimalist packaging, and sustainable sourcing. The company operates a membership model
  (an annual fee unlocking member pricing, free shipping, and store credit) and a wholesale channel. It was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist network. As a consumer retail
  brand it publishes no developer API, SDK, or technical documentation surface at this time.
